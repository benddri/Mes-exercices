<!DOCTYPE html>
<html lang="fr">

<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="main.js" defer></script>
</head>

<body class="p-8 space-y-4">
  <div class="space-x-2">

      data-nom="Rouge" data-prix-unitaire="5">Rouge</button>
    <button class="choix px-3 py-1 rounded bg-green-500 text-white" data-couleur="bg-green-500"

    <button class="choix px-3 py-1 rounded bg-blue-500 text-white" data-couleur="bg-blue-500"
      data-nom="Bleu">Bleu</button>
    <button class="choix px-3 py-1 rounded bg-yellow-500 text-white" data-couleur="bg-yellow-500"
      data-nom="Jaune">Jaune</button>

  <div id="apercu" class="h-32 rounded border"></div>
  <p id="info"></p>

</html>
